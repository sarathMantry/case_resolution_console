version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm install -D tailwindcss postcss autoprefixer &&
             npm run dev -- --host"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge